[project]
name = "didlogic-chatbot-outbound"
version = "0.1.0"
description = "Outbound DIDLogic Click2Call example for Pipecat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pipecat-didlogic",
  "pipecat-ai[cartesia,deepgram,openai,silero,websocket]>=1.12.0,<2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.uv.sources]
pipecat-didlogic = { path = "../..", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "UP"]
