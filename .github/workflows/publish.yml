name: Publish

on:
  release:
    types: [published]

jobs:
  # Kept apart from the publish job on purpose: building runs the build backend's
  # own code, and this job holds no id-token permission to mint an upload token with.
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${TAG#v}"
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "Release tag '$tag' does not match pyproject version '$version'." >&2
            exit 1
          fi

      - run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    # The name must match the environment configured on the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/pipecat-didlogic

    permissions:
      id-token: write # Mints the OIDC token PyPI trades for an upload token.

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
