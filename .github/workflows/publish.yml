name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    # The name must match the environment configured on the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/pipecat-didlogic

    permissions:
      contents: read
      id-token: write # Mints the OIDC token PyPI trades for an upload token.

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Check the release tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "Release tag '$tag' does not match pyproject version '$version'." >&2
            exit 1
          fi

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
